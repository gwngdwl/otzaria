name: Build Windows (Simple)

on:
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Google Calendar credentials stub
        shell: pwsh
        run: |
          @"
          class GoogleCalendarCredentials {
            static const String clientId = '';
            static const String clientSecret = '';
          }
          "@ | Out-File -FilePath "lib/tools/calendar/services/google_calendar_credentials.dart" -Encoding UTF8

      - name: Get dependencies & pre-build
        shell: pwsh
        run: |
          flutter pub get
          dart run pdfrx:remove_wasm_modules
          dart run tool/generate_search_index.dart

      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otzaria-windows
          path: build\windows\x64\runner\Release\
          retention-days: 7
